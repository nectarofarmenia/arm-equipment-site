const S={user:null,profile:null,tab:null,authMode:"in",recovery:false,equipment:[],orders:[],items:{},clients:[],cart:{},filter:"new",msg:null};

let sb=null;

async function loadProfile(){
  if(!S.user){S.profile=null;return}
  const {data}=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();
  S.profile=data||null;
}
async function loadData(){
  const p=S.profile;if(!p)return;
  const ok=p.is_admin||p.status==="approved";
  if(ok){const {data}=await sb.from("equipment").select("*").order("sort").order("id");S.equipment=data||[]}
  const q=sb.from("orders").select("*").order("created_at",{ascending:false});
  const {data:orders}=await q;S.orders=orders||[];
  if(S.orders.length){const {data:its}=await sb.from("order_items").select("*").in("order_id",S.orders.map(o=>o.id));S.items={};(its||[]).forEach(i=>(S.items[i.order_id]=S.items[i.order_id]||[]).push(i))}
  if(p.is_admin){const {data}=await sb.from("profiles").select("*").order("created_at",{ascending:false});S.clients=(data||[]).filter(c=>!c.is_admin);await loadInvoiceData()}
}
async function refresh(){await loadProfile();await loadData();render()}

function msgHtml(){return S.msg?`<div class="msg ${S.msg.k}">${esc(S.msg.m)}</div>`:""}

function vPending(){const r=S.profile.status==="rejected";return `<div class="card narrow"><h1>${t(r?"rejectedTitle":"pendingTitle")}</h1><p class="muted">${t(r?"rejectedSub":"pendingSub")}</p></div>`}

function cartTotal(){let sum=0,unp=false;for(const e of S.equipment){const q=S.cart[e.id]||0;if(!q)continue;if(e.price==null)unp=true;else sum+=e.price*q}return{sum,unp}}
function vNew(){
  const eq=S.equipment.filter(e=>e.active);
  let h=`<form id="fOrder"><h2 style="margin-top:0">${t("event")}</h2><div class="fg">
   <label>${t("start")}<input id="oS" type="date" required></label><label>${t("end")}<input id="oE" type="date"></label>
   <label>${t("city")}<select id="oC">${CITIES.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label><label>${t("venue")}<input id="oV"></label>
   <label>${t("type")}<select id="oT">${TYPES.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label><label>${t("layout")}<select id="oL">${LAYS.map(l=>`<option value="${l}">${esc(t("lay_"+l))}</option>`).join("")}</select></label>
   <label>${t("guests")}<input id="oG" type="number" min="0" inputmode="numeric"></label><label>${t("speakers")}<input id="oP" type="number" min="0" inputmode="numeric"></label>
   <label class="full">${t("langs")}<input id="oLg" placeholder="Հայերեն ↔ English, Русский"></label>
   <label class="full">${t("notes")}<textarea id="oN" rows="3"></textarea></label></div>
   <div class="eqsec"><h2>${t("equipment")}</h2><div class="eq">`;
  h+=eq.map(e=>{const q=S.cart[e.id]||0;return `<div class="eqr"><div><div class="nm">${esc(nm(e))}</div><div class="pr">${e.price==null?t("onRequest"):`<span class="num">${fmt(e.price)}</span> ${t("amd")} · ${t("perUnit")}`}</div></div>
    <div class="step"><button type="button" data-dec="${e.id}" aria-label="−">−</button><input type="number" min="0" step="1" inputmode="numeric" data-q="${e.id}" value="${q}" aria-label="${esc(nm(e))}"><button type="button" data-inc="${e.id}" aria-label="+">+</button></div>
    <div class="lt num" id="lt${e.id}">${q&&e.price!=null?fmt(e.price*q)+" "+t("amd"):q?"—":""}</div></div>`}).join("");
  const {sum,unp}=cartTotal();

  return h;

function updTotals(){for(const e of S.equipment){const el=$("#lt"+e.id);if(!el)continue;const q=S.cart[e.id]||0;el.textContent=q&&e.price!=null?fmt(e.price*q)+" "+t("amd"):q?"—":""}const {sum,unp}=cartTotal();$("#tot").textContent=fmt(sum)+" "+t("amd");$("#unp").hidden=!unp}

function orderCard(o,admin){
  const its=S.items[o.id]||[];const c=admin?S.clients.find(x=>x.id===o.client_id):null;
  const price=o.final_total!=null?`<b class="num">${fmt(o.final_total)} ${t("amd")}</b>`:`<span class="num">${fmt(o.total)} ${t("amd")}</span>${o.has_unpriced?" +":""}`;
  let h=`<details class="ord"><summary><span class="ttl">${t("order")} #${o.id} · ${esc(dt(o.start_date))}${o.end_date&&o.end_date!==o.start_date?" – "+esc(dt(o.end_date)):""}</span><span>${pill(o.status)}</span>
   <span class="sub">${admin&&c?esc(c.full_name)+(c.org?" · "+esc(c.org):"")+" · ":""}${esc(o.city)}${o.venue?" · "+esc(o.venue):""}${o.guests?" · "+o.guests+" "+(lang==="en"?"guests":"մասնակից"):""}</span><span>${price}</span></summary><div class="body">`;
  h+=`<div class="kv">${[["type",o.event_type],["layout",o.layout?t("lay_"+o.layout):""],["guests",o.guests],["speakers",o.speakers],["langs",o.languages]].filter(x=>x[1]!=null&&x[1]!=="").map(([k,v])=>`<div><span>${t(k)}</span>${esc(v)}</div>`).join("")}
   ${admin&&c?`<div><span>${t("client")}</span>${esc(c.full_name)}<br>${esc(c.email||"")}<br>${esc(c.phone||"")}</div>`:""}</div>`;
  if(o.notes)h+=`<div style="white-space:pre-wrap;font-size:.9rem">${esc(o.notes)}</div>`;
  h+=`<div class="tw"><table><thead><tr><th>${t("items")}</th><th class="r">${t("qty")}</th><th class="r">${t("price")}</th><th class="r">${t("sum")}</th></tr></thead><tbody>${its.map(i=>`<tr><td>${esc(nm(i))}</td><td class="r num">${i.qty}</td><td class="r num">${i.price==null?"—":fmt(i.price)}</td><td class="r num">${i.price==null?t("onRequest"):fmt(i.price*i.qty)}</td></tr>`).join("")}
   <tr><td colspan="3"><b>${t("total")}</b></td><td class="r num"><b>${fmt(o.total)}</b>${o.has_unpriced?" +":""}</td></tr>${o.final_total!=null?`<tr><td colspan="3"><b>${t("finalTotal")}</b></td><td class="r num"><b>${fmt(o.final_total)}</b></td></tr>`:""}</tbody></table></div>`;
  if(!admin&&o.admin_note)h+=`<div class="msg info">${esc(o.admin_note)}</div>`;
  if(!admin&&o.status==="new")h+=`<div><button class="btn sm danger" data-cancel="${o.id}">${t("cancelOrder")}</button></div>`;
  if(admin)h+=`<div class="fg"><label>${t("finalTotal")} (${t("amd")})<input id="ft${o.id}" type="number" min="0" inputmode="numeric" value="${o.final_total??""}" placeholder="${o.total}"></label><label>${t("adminNote")}<input id="an${o.id}" value="${esc(o.admin_note)}"></label></div>
   <div class="row">${["new","confirmed","done","cancelled"].map(s=>`<button class="btn sm ${s===o.status?"pri":""}" data-ost="${o.id}:${s}">${t("s_"+s)}</button>`).join("")}<span class="sp" style="flex:1"></span>${o.status==="confirmed"||o.status==="done"?`<button class="btn sm" data-mkinv="${o.id}">${it("fromOrder")}</button>`:""}<button class="btn sm pri" data-osave="${o.id}">${t("save")}</button></div>`;
  return h+`</div></details>`;
}
function vMine(){return S.orders.length?`<div class="list">${S.orders.map(o=>orderCard(o,false)).join("")}</div>`:`<div class="empty">${t("noOrders")}</div>`}
function vProfile(){const p=S.profile;return `<div class="card" style="max-width:520px"><form id="fProf"><label>${t("fullName")}<input id="pn" value="${esc(p.full_name)}" required></label><label>${t("org")}<input id="po" value="${esc(p.org)}"></label><label>${t("phone")}<input id="pp" type="tel" value="${esc(p.phone)}"></label><label>${t("email")}<input value="${esc(p.email||"")}" disabled></label><button class="btn pri">${t("save")}</button></form></div>`}

function vOrdersAdmin(){
  const f=S.filter;const list=S.orders.filter(o=>f==="all"||o.status===f);
  return `<div class="filters">${["new","confirmed","done","cancelled","all"].map(s=>`<button data-filter="${s}" aria-pressed="${f===s}">${s==="all"?t("all"):t("s_"+s)} (${s==="all"?S.orders.length:S.orders.filter(o=>o.status===s).length})</button>`).join("")}</div>`+
   (list.length?`<div class="list">${list.map(o=>orderCard(o,true)).join("")}</div>`:`<div class="empty">${t("noOrders")}</div>`);

}
function vPrices(){
  return `<p class="muted">${t("priceHint")}</p><div class="tw"><table><thead><tr><th>${t("name_hy")}</th><th>${t("name_en")}</th><th class="r">${t("price")}</th><th>${t("active")}</th><th></th></tr></thead><tbody>${S.equipment.map(e=>`<tr><td><input id="nh${e.id}" value="${esc(e.name_hy)}"></td><td><input id="ne${e.id}" value="${esc(e.name_en)}"></td><td class="r"><input class="pricein" id="pr${e.id}" type="number" min="0" inputmode="numeric" value="${e.price??""}"></td><td><input id="ac${e.id}" type="checkbox" style="width:auto" ${e.active?"checked":""}></td><td><button class="btn sm pri" data-esave="${e.id}">${t("save")}</button></td></tr>`).join("")}

function tabsFor(){const p=S.profile;if(!p)return[];if(p.is_admin)return[["orders","tOrders",S.orders.filter(o=>o.status==="new").length],["clients","tClients",S.clients.filter(c=>c.status==="pending").length],["invoices","tInv"],["calendar","tCal"],["income","tInc"],["inquiries","tInq",IS.inq.filter(q=>Date.now()-new Date(q.created_at)<7*864e5).length],["prices","tPrices"]];if(p.status==="approved")return[["new","tNew"],["mine","tMine",0],["profile","tProfile"]];return[]}
function render(){
  applyStatic();
  const main=$("#main");
  if(!sb){main.innerHTML=`<div class="card narrow msg err">${t("notConfigured")}</div>`;return}
  $("#out").hidden=!S.user;$("#who").textContent=S.profile?(S.profile.full_name||S.profile.email||""):"";
  const tabs=tabsFor();const nav=$("#tabs");nav.hidden=!tabs.length;
  if(tabs.length&&!tabs.some(x=>x[0]===S.tab))S.tab=tabs[0][0];
  nav.innerHTML=tabs.map(([k,l,c])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${t(l)}${c?`<span class="cnt">${c}</span>`:""}</button>`).join("");
  if(!S.user||S.recovery){main.innerHTML=vAuth();return}
  if(!S.profile){main.innerHTML=`<p class="muted">${t("loading")}</p>`;return}
  if(!S.profile.is_admin&&S.profile.status!=="approved"){main.innerHTML=vPending();return}
  const V={new:vNew,mine:vMine,profile:vProfile,orders:vOrdersAdmin,clients:vClients,prices:vPrices,invoices:vInvoices,calendar:vCalendar,income:vIncome,inquiries:vInquiries}[S.tab];
  main.innerHTML=V?V():"";
  if(S.tab==="invoices")invTotals();
  if(S.tab==="income")updSum();
}

/* ---------- events ---------- */
async function busy(btn,fn){if(btn)btn.disabled=true;try{await fn()}finally{if(btn)btn.disabled=false}}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-mode]");if(!b)return;
  if(b.dataset.mode){S.authMode=b.dataset.mode;S.msg=null;render();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.msg=null;render();scrollTo(0,0);return}
  if(b.id==="out"){await sb.auth.signOut();return}
  if(b.dataset.inc||b.dataset.dec){const id=+(b.dataset.inc||b.dataset.dec);S.cart[id]=Math.max(0,(S.cart[id]||0)+(b.dataset.inc?1:-1));const i=document.querySelector(`[data-q="${id}"]`);if(i)i.value=S.cart[id];updTotals();return}
  if(b.dataset.filter){S.filter=b.dataset.filter;render();return}
  if(b.dataset.cancel){await busy(b,async()=>{const {error}=await sb.rpc("cancel_my_order",{order_id:+b.dataset.cancel});if(error)return toast(t("errGeneric"));toast(t("cancelled"));await refresh()});return}
  if(b.dataset.cst){const [id,st]=b.dataset.cst.split(":");await busy(b,async()=>{const {error}=await sb.rpc("set_client_status",{client:id,new_status:st});if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh()});return}
  if(b.dataset.ost){const [id,st]=b.dataset.ost.split(":");await busy(b,async()=>{const {error}=await sb.from("orders").update({status:st}).eq("id",+id);if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh()});return}
  if(b.dataset.osave){const id=+b.dataset.osave;const ft=$("#ft"+id).value;await busy(b,async()=>{const {error}=await sb.from("orders").update({final_total:ft===""?null:Math.max(0,Math.round(+ft)),admin_note:$("#an"+id).value.trim()}).eq("id",id);if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh()});return}
  if(b.dataset.esave){const id=+b.dataset.esave;const pr=$("#pr"+id).value;await busy(b,async()=>{const {error}=await sb.from("equipment").update({name_hy:$("#nh"+id).value.trim(),name_en:$("#ne"+id).value.trim(),price:pr===""?null:Math.max(0,Math.round(+pr)),active:$("#ac"+id).checked}).eq("id",id);if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh()});return}
  if(b.id==="eAdd"){const h=$("#nhN").value.trim(),en=$("#neN").value.trim(),pr=$("#prN").value;if(!h||!en)return toast(t("fillAll"));await busy(b,async()=>{const max=Math.max(0,...S.equipment.map(x=>x.sort||0));const {error}=await sb.from("equipment").insert({name_hy:h,name_en:en,price:pr===""?null:Math.max(0,Math.round(+pr)),sort:max+10});if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh()});return}
});
document.addEventListener("input",e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){S.cart[+q]=Math.max(0,parseInt(e.target.value)||0);updTotals()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const btn=f.querySelector("button:not([type=button])");S.msg=null;
  const v=id=>($("#"+id)?.value||"").trim();
  await busy(btn,async()=>{
  if(f.id==="fIn"){const {error}=await sb.auth.signInWithPassword({email:v("em"),password:$("#pw").value});if(error){S.msg={k:"err",m:t("errLogin")};render()}return}
  if(f.id==="fUp"){if(!v("rn")||!v("rp")||!v("re")||$("#rw").value.length<8){S.msg={k:"err",m:t("fillAll")};return render()}
    const {data,error}=await sb.auth.signUp({email:v("re"),password:$("#rw").value,options:{data:{full_name:v("rn"),org:v("ro"),phone:v("rp")},emailRedirectTo:location.origin+location.pathname}});
    if(error){S.msg={k:"err",m:error.message};return render()}
    if(!data.session){S.authMode="in";S.msg={k:"ok",m:t("checkEmail")};render()}return}
  if(f.id==="fReset"){const {error}=await sb.auth.resetPasswordForEmail(v("xe"),{redirectTo:location.origin+location.pathname});S.msg=error?{k:"err",m:t("errGeneric")}:{k:"ok",m:t("resetSent")};render();return}
  if(f.id==="fPw"){const {error}=await sb.auth.updateUser({password:$("#pw1").value});if(error){S.msg={k:"err",m:error.message};return render()}S.recovery=false;toast(t("pwSaved"));await refresh();return}
  if(f.id==="fProf"){const {error}=await sb.from("profiles").update({full_name:v("pn"),org:v("po"),phone:v("pp")}).eq("id",S.user.id);if(error)return toast(t("errGeneric"));toast(t("saved"));await refresh();return}
  if(f.id==="fOrder"){
    const items=Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({equipment_id:+id,qty:q}));
    const err=m=>{S.msg={k:"err",m};const box=f.querySelector(".msg");if(box)box.outerHTML=msgHtml();else f.querySelector(".totalbar").insertAdjacentHTML("beforebegin",msgHtml())};
    if(!v("oS"))return err(t("needStart"));if(v("oE")&&v("oE")<v("oS"))return err(t("endBefore"));if(!items.length)return err(t("needItems"));
    const details={start_date:v("oS"),end_date:v("oE"),city:v("oC"),venue:v("oV"),event_type:v("oT"),layout:v("oL"),guests:v("oG"),speakers:v("oP"),languages:v("oLg"),notes:v("oN")};
    const {error}=await sb.rpc("place_order",{details,items});
    if(error)return err(t("errGeneric"));
    S.cart={};S.tab="mine";toast(t("placed"));await refresh();scrollTo(0,0);return}
  });
});

/* ---------- boot ---------- */
applyStatic();render();
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY")S.recovery=true;
    const changed=(session?.user?.id||null)!==(S.user?.id||null);
    S.user=session?.user||null;
    if(changed||ev==="PASSWORD_RECOVERY"){S.msg=null;setTimeout(refresh,0)}
  });
}
</script>

<script src="invoices.js"></script>
</body>
